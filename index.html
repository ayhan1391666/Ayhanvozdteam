<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه وجود ندارد</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 90%;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #ff6b6b;
        }
        p {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 20px;
            color: #e0e0e0;
        }
        .game-name {
            background: rgba(255, 107, 107, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
            margin: 15px 0;
            font-weight: bold;
            color: #ffd93d;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #4ecdc4;
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(78, 205, 196, 0.4);
        }
        .designer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">❌</div>
        <h1>صفحه وجود ندارد</h1>
        <p>هیچ بازی وجود ندارد</p>
        <div class="game-name">fftyuiospace</div>
        <p>برای دانلود بازی، به گوگل پلی بروید و نام بازی سازنده را جستجو کنید</p>
        <a href="https://play.google.com/store/search?q=fftyuiospace&c=games" target="_blank" class="btn">گوگل پلی</a>
        <div class="designer">Designer: Ayhanvozd</div>
    </div>
</body>
</html>
